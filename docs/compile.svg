<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250">
  <rect width="640" height="250" rx="10" fill="#0b0f14"/>
  <rect width="640" height="30" rx="10" fill="#131a22"/>
  <rect y="20" width="640" height="10" fill="#131a22"/>
  <circle cx="20" cy="15" r="5" fill="#e06c75"/>
  <circle cx="38" cy="15" r="5" fill="#e5c07b"/>
  <circle cx="56" cy="15" r="5" fill="#98c379"/>
  <text x="320" y="20" text-anchor="middle" font-family="monospace" font-size="11" fill="#5c6773">terra --emit-rust demo.tr</text>

  <text x="30" y="62" font-family="monospace" font-size="13" fill="#e07a5f"># demo.tr</text>
  <text x="330" y="62" font-family="monospace" font-size="13" fill="#7ee2b0">// generated</text>
  <line x1="320" y1="45" x2="320" y2="225" stroke="#1c2630" stroke-width="1"/>

  <!-- line 1 -->
  <g>
    <text x="30" y="95" font-family="monospace" font-size="13" fill="#d8dee9">x.10</text>
    <text x="350" y="95" font-family="monospace" font-size="13" fill="#dea584">let mut x: i64 = 10;</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.09;0.93;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- line 2 -->
  <g>
    <text x="30" y="125" font-family="monospace" font-size="13" fill="#d8dee9">x.+5</text>
    <text x="350" y="125" font-family="monospace" font-size="13" fill="#dea584">x += 5;</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.17;0.21;0.93;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- line 3 -->
  <g>
    <text x="30" y="155" font-family="monospace" font-size="13" fill="#d8dee9">log."n = ".x</text>
    <text x="350" y="155" font-family="monospace" font-size="13" fill="#dea584">println!("n = {}", x);</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.29;0.33;0.93;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- line 4 -->
  <g>
    <text x="30" y="185" font-family="monospace" font-size="13" fill="#d8dee9">q.</text>
    <text x="350" y="185" font-family="monospace" font-size="13" fill="#5c6773">}</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.45;0.93;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- status line -->
  <g>
    <text x="30" y="222" font-family="monospace" font-size="12" fill="#98c379">$ cargo run &#8594; exit 0</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.60;0.93;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- blinking caret -->
  <rect x="248" y="212" width="8" height="14" fill="#98c379">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
